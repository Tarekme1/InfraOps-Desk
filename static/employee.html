<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="بوابة الموظف المحلية التجريبية لمِحور">
  <title>مِحور | بوابة الموظف</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/employee.js" defer></script>
  <link rel="stylesheet" href="/static/employee.css">
</head>
<body>
  <main class="employee-shell">
    <header class="employee-head"><div class="employee-brand">مِحور <small>بوابة الموظف · بيئة تجريبية محلية</small></div><a class="btn secondary" href="/">دخول الفنيين</a></header>
    <section id="loginPanel" class="employee-card employee-login">
      <h1>تسجيل الدخول</h1><p class="subtitle">استخدم حسابًا اصطناعيًا أعدّه مسؤول النظام.</p>
      <form id="loginForm"><label>اسم المستخدم<input name="username" autocomplete="username" maxlength="80" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><p id="loginError" class="employee-error" role="alert"></p><button class="btn primary" type="submit">دخول آمن</button></form>
    </section>
    <section id="portal" class="hidden">
      <div class="employee-card"><div class="employee-head"><div><h1>بلاغاتي</h1><p class="subtitle">أنشئ بلاغًا وتابع تحديثاته.</p></div><button id="logoutButton" class="btn secondary" type="button">تسجيل الخروج</button></div><p class="employee-note">هذه بيئة تجريبية محلية ببيانات اصطناعية. لا تدخل بيانات أشخاص أو مواقع عمل حقيقية.</p></div>
      <div class="employee-card"><h2>بلاغ جديد</h2><form id="ticketForm"><label>عنوان المشكلة<input name="title" minlength="5" maxlength="120" required placeholder="مثال: تعذر الاتصال بالشبكة اللاسلكية"></label><div class="employee-grid"><label>نوع البلاغ<select name="category"><option>الشبكة والاتصال</option><option>الحسابات والصلاحيات</option><option>الأجهزة الطرفية</option><option>البرامج والخدمات</option><option>أخرى</option></select></label><label>الأصل المرتبط (اختياري)<select name="asset_id" id="assetOptions"><option value="">بدون أصل محدد</option></select></label></div><div class="employee-grid"><label>التأثير<select name="impact"><option value="1">محدود</option><option value="2" selected>عدة مستخدمين</option><option value="3">خدمة رئيسية</option></select></label><label>الاستعجال<select name="urgency"><option value="1">روتيني</option><option value="2" selected>قريبًا</option><option value="3">فوري</option></select></label></div><label>وصف المشكلة<textarea name="description" rows="4" maxlength="1500" required placeholder="اشرح ما حدث ومتى بدأ وما جربته"></textarea></label><p id="ticketError" class="employee-error" role="alert"></p><button class="btn primary" type="submit">إرسال البلاغ</button></form></div>
      <div class="employee-card"><h2>متابعة البلاغات</h2><div id="ticketList" aria-live="polite" class="employee-empty">جارٍ تحميل البلاغات…</div></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
